# Бесплатный проект Supabase засыпает после недели без запросов, и сайт тогда
# встречает редакцию ошибкой. Один запрос в сутки этого не допускает.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/brands_fashion?select=id&limit=1" > /dev/null
          echo "Supabase отвечает."
